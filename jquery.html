                async function fetchData() {
                    try {
                        loader.classList.remove('hidden');

                        const postsRes = await fetch('https://jsonplaceholder.typicode.com/posts')
                        const usersRes = await fetch('https://jsonplaceholder.typicode.com/users')
                        
                        const posts = await postsRes.json()
                        const users = await usersRes.json()
                       
                        displayPosts(posts.slice(0, 10));
                        displayUsers(users);

                        console.log(posts)
                        console.log(users)
                    } catch (error) {
                        console.error("Error fetching data:", error);
                        postsContainer.innerHTML = `<p class="text-red-500 font-medium">Failed to load content.</p>`;
                    } finally {
                         loader.classList.add('hidden');

                    }
                    }

                    
        function displayPosts(posts) {
            postsContainer.innerHTML = posts.map((post, index) => `
                <div class="pt-4 ${index === 0 ? 'pt-0' : ''}">
                    <h3 class="text-lg font-semibold text-gray-900 capitalize">${post.title}</h3>
                    <p class="text-gray-600 mt-1">${post.body}</p>
                </div>
            `).join('');
        }

        function displayUsers(users) {
            usersContainer.innerHTML = users.map(user => `
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition-shadow duration-200">
                    <div class="flex items-center space-x-3 mb-3">
                        <div class="h-10 w-10 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center font-bold">
                            ${user.name.charAt(0)}
                        </div>
                        <div>
                            <h3 class="font-bold text-gray-900">${user.name}</h3>
                            <p class="text-sm text-gray-500">${user.email}</p>
                        </div>
                    </div>
                    <div class="mt-4 pt-3 border-t border-gray-100 text-xs text-gray-400 font-medium tracking-wide uppercase">
                        🏢 ${user.company.name}
                    </div>
                </div>
            `).join('');
        }

        // Kick off fetching
        fetchData();
